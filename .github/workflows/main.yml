name: ML-FastAPI-CI-CD-Pipeline

# 1. Setting the Rules: หุ่นยนต์จะตื่นมาทำงานเมื่อไหร่
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 2. The Testing Job (CI): ตรวจความปลอดภัย
  test-api:
    runs-on: ubuntu-latest 
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' 
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pytest
        run: pytest test/test_app.py # ตรวจข้อสอบ (The Moment of Truth)

  # 3. The CD Job: ประกอบร่างและส่งขึ้น Cloud
  build-and-deploy:
    needs: test-api # ต้องผ่านเทสต์ก่อน
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # ทำเฉพาะตอน Push โค้ดเข้า main เท่านั้น
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Build Docker Image
        run: docker build -t my-ml-api:latest .
        
      # ส่งขึ้น Hugging Face 
      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} 
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git push https://katanyapat:$HF_TOKEN@huggingface.co/spaces/katanyapat/dog-cat-api main -f